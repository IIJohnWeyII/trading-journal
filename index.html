<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="交易日志"/>
<meta name="theme-color" content="#F2F2F7"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>交易日志</title>
<style>
:root{
  --bg:#F2F2F7;--card:#FFF;--card2:#F9F9FB;
  --t:#1C1C1E;--t2:#6E6E73;--t3:#AEAEB2;
  --b:rgba(0,0,0,.08);--b2:rgba(0,0,0,.12);
  --accent:#007AFF;--al:rgba(0,122,255,.10);
  --green:#34C759;--gl:rgba(52,199,89,.12);
  --red:#FF3B30;--rl:rgba(255,59,48,.12);
  --orange:#FF9500;--ol:rgba(255,149,0,.12);
  --r:14px;--rs:10px;--rx:8px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',sans-serif;
  --mono:'SF Mono',SFMono-Regular,ui-monospace,monospace;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--t);min-height:100vh;padding-bottom:calc(84px + var(--sb));-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* Splash */
#splash{position:fixed;inset:0;background:var(--accent);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s ease,transform .4s ease}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
#splash-icon{width:80px;height:80px;background:white;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:splashPop .5s cubic-bezier(.34,1.56,.64,1) both}
#splash h1{color:white;font-size:22px;font-weight:700;letter-spacing:-.3px;opacity:0;animation:fadeUp .4s .2s ease both}
#splash p{color:rgba(255,255,255,.7);font-size:14px;opacity:0;animation:fadeUp .4s .3s ease both}
@keyframes splashPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Header */
.hdr{background:rgba(242,242,247,.85);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);position:sticky;top:0;z-index:100;padding:calc(12px + var(--st)) 20px 12px;border-bottom:.5px solid var(--b)}
.hdr-in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.hdr-date{font-size:13px;color:var(--t2)}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--b);padding:6px 0 calc(6px + var(--sb));z-index:100}
.nav-in{max-width:480px;margin:0 auto;display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;cursor:pointer;border:none;background:none;font-family:var(--font);color:var(--t3);transition:color .2s ease}
.nb.active{color:var(--accent)}
.nb-icon-wrap{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .15s cubic-bezier(.34,1.56,.64,1)}
.nb.active .nb-icon-wrap{background:var(--al);transform:scale(1.1)}
.ni{font-size:20px;line-height:1}.nl{font-size:10px;font-weight:500;letter-spacing:-.2px}

/* Content */
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 8px}
.tab{display:none;animation:tabIn .25s cubic-bezier(.4,0,.2,1) both}
.tab.active{display:block}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sec{margin-bottom:24px}
.sec-h{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding:0 4px}

/* Card */
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 var(--b),0 0 0 .5px var(--b)}
.cr{display:flex;align-items:center;padding:13px 16px;border-bottom:.5px solid var(--b);gap:12px;transition:background .1s ease}
.cr:last-child{border-bottom:none}
.cr:active{background:rgba(0,0,0,.03)}
.cr label{font-size:15px;color:var(--t);flex-shrink:0;min-width:80px}
.cr input,.cr select{flex:1;border:none;background:none;font-size:16px;color:var(--t);font-family:var(--font);text-align:right;outline:none;min-width:0;-webkit-appearance:none;transition:color .15s}
.cr input:focus{color:var(--accent)}
.cr input::placeholder{color:var(--t3)}
.cr select{color:var(--t2)}
.ct{padding:13px 16px;border-bottom:.5px solid var(--b)}
.ct:last-child{border-bottom:none}
.ct label{display:block;font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:500}
.ct textarea{width:100%;border:none;background:none;font-size:16px;color:var(--t);font-family:var(--font);resize:none;outline:none;line-height:1.55;min-height:44px;transition:min-height .2s ease}
.ct textarea:focus{min-height:72px}
.ct textarea::placeholder{color:var(--t3)}

/* Tags */
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{padding:5px 12px;border-radius:20px;font-size:13px;cursor:pointer;border:.5px solid var(--b2);background:var(--bg);color:var(--t2);transition:all .18s cubic-bezier(.4,0,.2,1);-webkit-user-select:none;user-select:none;white-space:nowrap;transform:scale(1)}
.tag:active{transform:scale(.93)}
.tag.sel{background:var(--al);border-color:var(--accent);color:var(--accent);font-weight:600;transform:scale(1.04)}

/* Direction */
.dir-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.dc{background:var(--card);border-radius:var(--rs);box-shadow:0 1px 0 var(--b),0 0 0 .5px var(--b);padding:16px;text-align:center;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);border:2px solid transparent}
.dc:active{transform:scale(.96)}
.dc .di{font-size:26px;margin-bottom:5px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.dc .dl{font-size:14px;font-weight:600}.dc .ds{font-size:12px;color:var(--t2);margin-top:2px}
.dc.la{background:var(--gl);border-color:var(--green)}.dc.la .dl{color:#1A7A35}.dc.la .di{transform:translateY(-2px) scale(1.15)}
.dc.sa{background:var(--rl);border-color:var(--red)}.dc.sa .dl{color:#C0392B}.dc.sa .di{transform:translateY(2px) scale(1.15)}

/* Calc */
.calc-box{background:var(--card2);border-radius:var(--r);padding:18px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;box-shadow:0 0 0 .5px var(--b);margin-top:10px}
.ci{text-align:center;padding:6px 4px;position:relative}
.ci+.ci::before{content:'';position:absolute;left:0;top:15%;bottom:15%;width:.5px;background:var(--b2)}
.cv{font-size:18px;font-weight:700;font-family:var(--mono);color:var(--t);letter-spacing:-.5px;transition:all .3s cubic-bezier(.4,0,.2,1)}
.cv.g{color:var(--green)}.cv.r{color:var(--red)}.cv.a{color:var(--accent)}
.cl{font-size:11px;color:var(--t2);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.cs{font-size:11px;color:var(--t3);margin-top:2px;min-height:14px}
.warn,.info-box{display:none;margin-top:8px;border-radius:var(--rs);padding:11px 14px;font-size:13px;font-weight:500;line-height:1.55;animation:alertIn .25s cubic-bezier(.4,0,.2,1)}
@keyframes alertIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.warn{background:var(--rl);border:1px solid rgba(255,59,48,.3);color:#C0392B}
.info-box{background:var(--al);border:1px solid rgba(0,122,255,.25);color:var(--accent)}

/* Result */
.res-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rc{background:var(--card);border-radius:var(--rs);box-shadow:0 1px 0 var(--b),0 0 0 .5px var(--b);padding:14px 6px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s cubic-bezier(.4,0,.2,1)}
.rc:active{transform:scale(.94)}
.rc .ri{font-size:22px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}.rc .rl{font-size:13px;font-weight:600;margin-top:5px}
.rc.wa{background:var(--gl);border-color:var(--green)}.rc.wa .rl{color:#1A7A35}.rc.wa .ri{transform:scale(1.2)}
.rc.la2{background:var(--rl);border-color:var(--red)}.rc.la2 .rl{color:#C0392B}.rc.la2 .ri{transform:scale(1.2)}
.rc.fa{background:var(--ol);border-color:var(--orange)}.rc.fa .rl{color:#A05F00}.rc.fa .ri{transform:scale(1.2)}

/* Emo */
.emo-w{padding:14px 16px}
.emo-l{font-size:13px;color:var(--t2);font-weight:500;margin-bottom:12px}
.emo-r{display:flex;align-items:center;gap:10px}
.emo-r span{font-size:12px;color:var(--t3);white-space:nowrap}
.emo-v{font-size:18px;font-weight:700;color:var(--accent);min-width:28px;text-align:center;font-family:var(--mono);transition:all .15s ease}
input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:linear-gradient(to right,var(--accent) 0%,var(--accent) 70%,var(--b2) 70%);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:white;border:.5px solid var(--b2);box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}

/* Image grid */
.img-section{padding:13px 16px 0}
.img-section label{display:block;font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:500}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.img-thumb{position:relative;aspect-ratio:1;border-radius:var(--rx);overflow:hidden;cursor:pointer;background:var(--bg)}
.img-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .2s ease}
.img-thumb:active img{transform:scale(.96)}
.img-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:white;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;transition:background .15s,transform .15s}
.img-del:active{background:rgba(255,59,48,.8);transform:scale(1.1)}
.img-add{aspect-ratio:1;border-radius:var(--rx);border:1.5px dashed var(--b2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,background .2s;background:none}
.img-add:active{border-color:var(--accent);background:var(--al)}
.img-add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-add-icon{font-size:22px}
.img-add-txt{font-size:11px;color:var(--t3);margin-top:4px}

/* Lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;animation:lbIn .25s ease}
#lightbox.open{display:flex}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lb-close{position:absolute;top:calc(16px + var(--st));right:20px;color:white;font-size:28px;cursor:pointer;z-index:10;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);border-radius:50%;transition:background .15s}
#lb-close:active{background:rgba(255,255,255,.3)}
#lb-counter{position:absolute;top:calc(22px + var(--st));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:14px;font-weight:500}
#lb-track{display:flex;width:100%;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.lb-slide{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:60px 16px calc(40px + var(--sb))}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

/* Buttons */
.btn{width:100%;padding:16px;border:none;border-radius:var(--r);font-size:17px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:10px;letter-spacing:-.2px;transition:transform .15s cubic-bezier(.4,0,.2,1),opacity .15s}
.btn:active{transform:scale(.97);opacity:.9}
.btn-blue{background:var(--accent);color:white;box-shadow:0 4px 16px rgba(0,122,255,.3)}
.btn-green{background:var(--green);color:white;box-shadow:0 4px 16px rgba(52,199,89,.3)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn-row .btn{margin-top:0}
.btn-outline{background:var(--bg);color:var(--accent);border:.5px solid var(--accent);box-shadow:none}

/* Stats */
.stats-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-c{background:var(--card);border-radius:var(--rs);padding:14px 16px;box-shadow:0 1px 0 var(--b),0 0 0 .5px var(--b);animation:cardIn .3s cubic-bezier(.4,0,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.sv{font-size:24px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px}
.sl{font-size:12px;color:var(--t2);margin-top:4px;font-weight:500}
.sd{font-size:11px;color:var(--t3);margin-top:3px;line-height:1.4}
.sv.g{color:var(--green)}.sv.r{color:var(--red)}

/* History - see below edit-mode-bar section */

/* Toast */
.toast{position:fixed;bottom:calc(94px + var(--sb));left:50%;transform:translateX(-50%) translateY(12px) scale(.95);background:rgba(30,30,30,.92);color:white;padding:11px 22px;border-radius:22px;font-size:14px;font-weight:500;pointer-events:none;opacity:0;transition:all .3s cubic-bezier(.34,1.2,.64,1);z-index:600;max-width:88vw;text-align:center;white-space:pre-line;backdrop-filter:blur(12px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

/* Misc */
.info-hint{background:var(--al);border-radius:var(--rs);padding:12px 14px;font-size:13px;color:var(--accent);margin-bottom:16px;font-weight:500;line-height:1.5}
.pending-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ol);border-radius:20px;padding:7px 14px;font-size:13px;color:#A05F00;font-weight:600;margin-bottom:12px;animation:badgePulse 2s ease infinite}
@keyframes badgePulse{0%,100%{opacity:1}50%{opacity:.7}}
.tag-mgr-add{display:flex;gap:8px;margin-top:10px}
.tag-mgr-add input{flex:1;border:.5px solid var(--b2);border-radius:var(--rx);padding:9px 12px;font-size:14px;font-family:var(--font);outline:none;background:var(--bg);color:var(--t)}
.tag-mgr-add input:focus{border-color:var(--accent)}
.tag-mgr-add button{padding:9px 16px;background:var(--accent);color:white;border:none;border-radius:var(--rx);font-size:14px;cursor:pointer;font-family:var(--font);font-weight:500}
.edit-mode-bar{background:var(--al);border-radius:var(--rs);padding:10px 14px;font-size:13px;color:var(--accent);margin-bottom:12px;font-weight:600;display:none;align-items:center;justify-content:space-between}
.edit-mode-bar.show{display:flex}
.edit-cancel{font-size:13px;color:var(--red);cursor:pointer;font-weight:600}

/* History card expanded */
.hi{background:var(--card);border-radius:var(--rs);margin-bottom:8px;box-shadow:0 1px 0 var(--b),0 0 0 .5px var(--b);overflow:hidden;animation:cardIn .3s cubic-bezier(.4,0,.2,1) both}
.hi-main{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .1s ease}
.hi-main:active{background:rgba(0,0,0,.02)}
.hi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hi-dot.win{background:var(--green)}.hi-dot.loss{background:var(--red)}.hi-dot.flat{background:var(--orange)}.hi-dot.open{background:var(--accent)}
.hi-info{flex:1;min-width:0}
.hi-top{display:flex;align-items:center;justify-content:space-between}
.hi-asset{font-size:15px;font-weight:600}
.hi-pnl{font-size:15px;font-weight:700;font-family:var(--mono)}
.hi-pnl.g{color:var(--green)}.hi-pnl.r{color:var(--red)}
.hi-bot{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.hi-date{font-size:12px;color:var(--t3)}.hi-dir{font-size:12px;color:var(--t2)}
.hi-more{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:18px;color:var(--t3);cursor:pointer;flex-shrink:0;transition:background .15s,color .15s}
.hi-more:active{background:var(--bg);color:var(--t)}
.hi-detail{display:none;padding:0 16px 14px;border-top:.5px solid var(--b)}
.hi-detail.open{display:block;animation:fadeIn .2s ease}
.hi-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.hi-tag{padding:3px 10px;border-radius:20px;font-size:12px;background:var(--al);color:var(--accent);font-weight:500}
.hi-tag.trigger{background:var(--gl);color:#1A7A35}
.hi-thumbs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.hi-thumb{width:56px;height:56px;border-radius:var(--rx);object-fit:cover;cursor:pointer;transition:transform .15s}
.hi-thumb:active{transform:scale(.93)}
.hi-note{font-size:13px;color:var(--t2);margin-top:8px;line-height:1.5}
.hi-actions{display:flex;gap:8px;margin-top:12px}
.hi-action-btn{flex:1;padding:9px;border-radius:var(--rx);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);border:none;transition:opacity .15s,transform .15s}
.hi-action-btn:active{opacity:.8;transform:scale(.97)}
.hi-action-btn.edit{background:var(--al);color:var(--accent)}
.hi-action-btn.review{background:var(--gl);color:#1A7A35}
.hi-action-btn.review-edit{background:var(--ol);color:#A05F00}
.empty{text-align:center;padding:48px 20px;color:var(--t3);font-size:15px;line-height:1.6}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div id="splash-icon">📈</div>
  <h1>交易日志</h1>
  <p>记录每一次决策</p>
</div>

<!-- Lightbox -->
<div id="lightbox">
  <div id="lb-close" onclick="closeLb()">✕</div>
  <div id="lb-counter"></div>
  <div id="lb-track"></div>
</div>

<div class="hdr">
  <div class="hdr-in">
    <h1>交易日志</h1>
    <span class="hdr-date" id="hdr-date"></span>
  </div>
</div>

<div class="wrap">

<!-- 入场 -->
<div class="tab active" id="tab-entry">
  <div id="pending-notice" style="display:none;margin-bottom:4px">
    <div class="pending-badge">⚠ 上笔交易待复盘，请先完成复盘</div>
  </div>
  <div class="edit-mode-bar" id="entry-edit-bar">
    <span>✏️ 编辑模式 — 修改后点保存更新</span>
    <span class="edit-cancel" onclick="cancelEntryEdit()">取消</span>
  </div>

  <div class="sec">
    <div class="sec-h">方向</div>
    <div class="dir-g">
      <div class="dc" id="dir-long" onclick="setDir('long')"><div class="di">↑</div><div class="dl">做多</div><div class="ds">Long</div></div>
      <div class="dc" id="dir-short" onclick="setDir('short')"><div class="di">↓</div><div class="dl">做空</div><div class="ds">Short</div></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">品种 & 时间</div>
    <div class="card">
      <div class="cr"><label>品种</label>
        <select id="e-asset" onchange="onAssetChange()">
          <option value="">选择</option>
          <option value="BTC">BTC/USDT</option>
          <option value="ETH">ETH/USDT</option>
          <option value="SOL">SOL/USDT</option>
          <option value="gold">黄金 XAU/USD</option>
        </select>
      </div>
      <div class="cr"><label>周期</label>
        <select id="e-tf"><option>4小时</option><option>日线</option><option>1小时</option><option>15分钟</option><option>周线</option></select>
      </div>
      <div class="cr"><label>日期</label><input type="date" id="e-date"/></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">价格计算</div>
    <div class="card">
      <div class="cr"><label>入场价格</label><input type="number" id="e-entry" placeholder="e.g. 95000" inputmode="decimal" oninput="calc()"/></div>

<div class="toast" id="toast"></div>

<script>
var dirState='', resState='', reviewTargetId=null, editingEntryId=null;
var selMethods=[], selTriggers=[];
var entryImgs=[], reviewImgs=[], lbHistoryImgs=[];
var CRYPTO_MIN={BTC:0.001,ETH:0.01,SOL:0.1};
var DEF_METHODS=['价格行为PA','突破回踩','支撑阻力','趋势跟随','OB订单块','FVG缺口','双顶/双底','均线交叉'];
var DEF_TRIGGERS=['4H收线确认','回踩获支撑','成交量放大','突破关键位','K线形态确认','背离信号','EMA支撑'];

function G(id){return document.getElementById(id);}
function T(id,v){G(id).textContent=v;}

// ── Splash ──
window.addEventListener('load',function(){
  setTimeout(function(){
    G('splash').classList.add('hide');
    setTimeout(function(){G('splash').style.display='none';},400);
  },900);
});

function init(){
  var d=new Date();
  G('hdr-date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
  G('e-date').value=d.toISOString().split('T')[0];
  loadSettings();
  renderMethodTags();renderTriggerTags();
  renderImgGrid('entry');renderImgGrid('review');
  checkPending();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
}

// ── Tabs ──
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('active');});
  G('tab-'+name).classList.add('active');
  (el||G('nav-'+name)).classList.add('active');
}

// ── Direction / Result ──
function setDir(d){
  dirState=d;
  G('dir-long').className='dc'+(d==='long'?' la':'');
  G('dir-short').className='dc'+(d==='short'?' sa':'');
  calc();
}
function setRes(r){
  resState=r;
  ['win','loss','flat'].forEach(function(x){G('rb-'+x).className='rc';});
  var m={win:'wa',loss:'la2',flat:'fa'};
  if(r&&m[r]) G('rb-'+r).className='rc '+m[r];
}
function updateEmo(v){
  G('emo-out').textContent=v;
  var pct=v/10*100;
  G('r-emo').style.background='linear-gradient(to right,var(--accent) 0%,var(--accent) '+pct+'%,var(--b2) '+pct+'%)';
}

// ── Asset ──
function getAssetType(){
  var v=G('e-asset').value;
  if(v==='gold') return 'gold';
  if(CRYPTO_MIN[v]) return 'crypto';
  return '';
}
function onAssetChange(){
  var t=getAssetType();
  G('lev-row').style.display=t==='gold'?'none':'flex';
  T('c-pos-lbl',t==='gold'?'手数 (lots)':'保证金 (USDT)');
  calc();
}

// ── Calc ──
function animVal(id,val){
  var el=G(id);
  el.style.transform='scale(.85)';el.style.opacity='.5';
  setTimeout(function(){el.textContent=val;el.style.transform='';el.style.opacity='';el.style.transition='transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease';},80);
}
function calc(){
  var entry=parseFloat(G('e-entry').value);
  var slP=parseFloat(G('e-slprice').value);
  var rr=parseFloat(G('e-rr').value)||2;
  var maxL=parseFloat(G('e-maxloss').value);
  var isS=dirState==='short';
  var type=getAssetType();
  var warn=G('risk-warn'),info=G('risk-info');
  function reset(){['c-sl','c-tp','c-pos'].forEach(function(id){T(id,'—');});T('c-sl-d','—');T('c-rr-s','—');T('c-risk-a','填入场信息');warn.style.display='none';info.style.display='none';}
  if(!entry||!slP){reset();return;}
  if(dirState==='long'&&slP>=entry){reset();T('c-sl-d','止损应低于入场价');return;}
  if(dirState==='short'&&slP<=entry){reset();T('c-sl-d','止损应高于入场价');return;}
  var slD=Math.abs(entry-slP);
  var tp=isS?entry-slD*rr:entry+slD*rr;
  animVal('c-sl',slP>=100?slP.toFixed(2):slP.toFixed(4));
  animVal('c-tp',tp>=100?tp.toFixed(2):tp.toFixed(4));
  T('c-rr-s','1 : '+rr);
  if(type==='gold'){
    T('c-sl-d','$'+slD.toFixed(2)+' / '+(slD/entry*100).toFixed(2)+'%');
    if(maxL){
      var minR=slD*0.01*100;
      if(maxL<minR){animVal('c-pos','—');T('c-risk-a','无法开仓');warn.textContent='⚠️ 最大亏损 $'+maxL.toFixed(2)+' 不足。最小仓位风险为 $'+minR.toFixed(2)+'。';warn.style.display='block';info.style.display='none';}
      else{var lots=Math.floor(maxL/(slD*100)*100)/100,aR=slD*lots*100;animVal('c-pos',lots.toFixed(2)+' 手');T('c-risk-a','实际亏 $'+aR.toFixed(2));warn.style.display='none';if(aR<maxL*0.95){info.textContent='ℹ️ 手数取整至 '+lots.toFixed(2)+' 手，实际最大亏 $'+aR.toFixed(2)+'。';info.style.display='block';}else info.style.display='none';}
    }else{animVal('c-pos','—');T('c-risk-a','填最大亏损');warn.style.display='none';info.style.display='none';}
  }else{
    var lev=parseFloat(G('e-lev').value)||10,slPct=slD/entry*100;
    T('c-sl-d',(isS?'+':'-')+slPct.toFixed(2)+'%');
    if(maxL){
      var sym=G('e-asset').value,mq=CRYPTO_MIN[sym]||0.001,mrc=slD*mq;
      if(maxL<mrc){animVal('c-pos','—');T('c-risk-a','无法开仓');warn.textContent='⚠️ 最大亏损 '+maxL.toFixed(2)+' U 不足。最小风险为 '+mrc.toFixed(2)+' U。';warn.style.display='block';info.style.display='none';}
      else{var qty=Math.floor(maxL/slD/mq)*mq,arc=slD*qty,mg=qty*entry/lev;animVal('c-pos',mg.toFixed(2)+' U');T('c-risk-a','实际亏 '+arc.toFixed(2)+' U');warn.style.display='none';if(lev>50){warn.textContent='⚠️ 杠杆 '+lev+'x 偏高，请谨慎。';warn.style.display='block';info.style.display='none';}else if(arc<maxL*0.95){info.textContent='ℹ️ 数量取整，实际最大亏 '+arc.toFixed(2)+' U。';info.style.display='block';}else info.style.display='none';}
    }else{animVal('c-pos','—');T('c-risk-a','填最大亏损');warn.style.display='none';info.style.display='none';}
  }
}
function calcExit(){
  var entry=parseFloat(G('e-entry').value),slP=parseFloat(G('e-slprice').value),exit=parseFloat(G('r-exit').value),maxL=parseFloat(G('e-maxloss').value),type=getAssetType();
  if(!entry||!exit)return;
  var isS=dirState==='short',slD=slP?Math.abs(entry-slP):1;
  if(type==='gold'){var lots=parseFloat(G('c-pos').textContent)||0,pnl=(isS?(entry-exit):(exit-entry))*lots*100,rA=maxL?(pnl/maxL).toFixed(2):'—';G('r-pnl').value='$'+pnl.toFixed(2)+' ('+rA+'R)';}
  else{var pp=isS?(entry-exit)/entry*100:(exit-entry)/entry*100,sp=slD/entry*100,rA2=sp>0?(pp/sp).toFixed(2):'—',lev=parseFloat(G('e-lev').value)||10,mg=parseFloat(G('c-pos').textContent)||0,pa=mg*lev*(pp/100),ps=pa?' / '+(pa>=0?'+':'')+pa.toFixed(2)+' U':'';G('r-pnl').value=pp.toFixed(2)+'%'+ps+' ('+rA2+'R)';}
}

// ── Image Management ──
function renderImgGrid(which){
  var imgs=which==='entry'?entryImgs:reviewImgs;
  var grid=G(which+'-img-grid');
  var html=imgs.map(function(src,i){
    return '<div class="img-thumb" onclick="openLb(\''+which+'\','+i+')" style="animation:cardIn .2s '+(i*0.05)+'s both">'
      +'<img src="'+src+'"/>'
      +'<div class="img-del" onclick="delImg(event,\''+which+'\','+i+')">✕</div>'
      +'</div>';
  }).join('');
  // Add button (always show, max 9)
  if(imgs.length<9){
    html+='<div class="img-add">'
      +'<input type="file" accept="image/*" multiple onchange="addImgs(this,\''+which+'\')" />'
      +'<div class="img-add-icon">+</div>'
      +'<div class="img-add-txt">添加截图</div>'
      +'</div>';
  }
  grid.innerHTML=html;
}

function addImgs(input,which){
  var files=Array.from(input.files);
  var imgs=which==='entry'?entryImgs:reviewImgs;
  var remaining=9-imgs.length;
  files.slice(0,remaining).forEach(function(f){
    var r=new FileReader();
    r.onload=function(e){
      imgs.push(e.target.result);
      renderImgGrid(which);
    };
    r.readAsDataURL(f);
  });
  if(files.length>remaining) showToast('最多9张，已忽略多余的截图');
}

function delImg(e,which,idx){
  e.stopPropagation();
  var imgs=which==='entry'?entryImgs:reviewImgs;
  imgs.splice(idx,1);
  renderImgGrid(which);
}

// Paste support
document.addEventListener('paste',function(e){
  var items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  var which=G('tab-review').classList.contains('active')?'review':'entry';
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')!==-1){
      var f=items[i].getAsFile(),r=new FileReader();
      var imgs=which==='entry'?entryImgs:reviewImgs;
      if(imgs.length>=9){showToast('已达最大9张');break;}
      (function(imgs2,which2){
        r.onload=function(ev){imgs2.push(ev.target.result);renderImgGrid(which2);};
      })(imgs,which);
      r.readAsDataURL(f);
    }
  }
});

// ── Lightbox ──
var lbWhich='', lbIdx=0, lbStartX=0, lbDragging=false;

function openLb(which,idx){
  lbWhich=which;lbIdx=idx;
  var imgs=which==='entry'?entryImgs:reviewImgs;
  var track=G('lb-track');
  track.innerHTML=imgs.map(function(src){return '<div class="lb-slide"><img src="'+src+'"/></div>';}).join('');
  track.style.transition='none';
  track.style.transform='translateX(-'+idx+'00%)';
  G('lb-counter').textContent=(idx+1)+' / '+imgs.length;
  G('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
  // swipe
  var lb=G('lightbox');
  lb.addEventListener('touchstart',lbTouchStart,{passive:true});
  lb.addEventListener('touchend',lbTouchEnd,{passive:true});
}

function closeLb(){
  G('lightbox').classList.remove('open');
  document.body.style.overflow='';
  var lb=G('lightbox');
  lb.removeEventListener('touchstart',lbTouchStart);
  lb.removeEventListener('touchend',lbTouchEnd);
}

function lbGoto(idx){
  var imgs=lbWhich.indexOf('_history_')===0?lbHistoryImgs:(lbWhich==='entry'?entryImgs:reviewImgs);
  if(idx<0||idx>=imgs.length)return;
  lbIdx=idx;
  var track=G('lb-track');
  track.style.transition='transform .3s cubic-bezier(.4,0,.2,1)';
  track.style.transform='translateX(-'+idx+'00%)';
  G('lb-counter').textContent=(idx+1)+' / '+imgs.length;
}

function lbTouchStart(e){lbStartX=e.touches[0].clientX;}
function lbTouchEnd(e){
  var dx=e.changedTouches[0].clientX-lbStartX;
  if(Math.abs(dx)>50){if(dx<0)lbGoto(lbIdx+1);else lbGoto(lbIdx-1);}
}

// keyboard arrow support
document.addEventListener('keydown',function(e){
  if(!G('lightbox').classList.contains('open'))return;
  if(e.key==='ArrowRight')lbGoto(lbIdx+1);
  else if(e.key==='ArrowLeft')lbGoto(lbIdx-1);
  else if(e.key==='Escape')closeLb();
});

// ── Tags ──
function getTags(type){try{return JSON.parse(localStorage.getItem('tj_'+type+'s')||'null')||(type==='method'?DEF_METHODS:DEF_TRIGGERS);}catch(e){return type==='method'?DEF_METHODS:DEF_TRIGGERS;}}
function saveTags(type,tags){localStorage.setItem('tj_'+type+'s',JSON.stringify(tags));}
function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function renderMethodTags(){
  var tags=getTags('method'),w=G('method-tags');if(!w)return;
  w.innerHTML=tags.map(function(t){var s=selMethods.indexOf(t)>=0;return '<span class="tag'+(s?' sel':'')+'" onclick="toggleTag(\'method\',\''+esc(t)+'\')">'+(s?'✓ ':'')+t+'</span>';}).join('');
}
function renderTriggerTags(){
  var tags=getTags('trigger'),w=G('trigger-tags');if(!w)return;
  w.innerHTML=tags.map(function(t){var s=selTriggers.indexOf(t)>=0;return '<span class="tag'+(s?' sel':'')+'" onclick="toggleTag(\'trigger\',\''+esc(t)+'\')">'+(s?'✓ ':'')+t+'</span>';}).join('');
}
function toggleTag(type,t){
  var arr=type==='method'?selMethods:selTriggers,i=arr.indexOf(t);
  if(i>=0)arr.splice(i,1);else arr.push(t);
  if(type==='method'){renderMethodTags();G('e-method').value=selMethods.join('、');}
  else{renderTriggerTags();G('e-trigger').value=selTriggers.join('、');}
}
function renderTagMgr(){
  ['method','trigger'].forEach(function(type){
    var tags=getTags(type);
    G(type+'-mgr').innerHTML=tags.map(function(t,i){return '<span class="tag" onclick="removeTag(\''+type+'\','+i+')">'+t+' ✕</span>';}).join('');
  });
}
function addTag(type){var inp=G('new-'+type),v=inp.value.trim();if(!v)return;var tags=getTags(type);tags.push(v);saveTags(type,tags);inp.value='';renderTagMgr();if(type==='method')renderMethodTags();else renderTriggerTags();showToast('已添加「'+v+'」');}
function removeTag(type,i){var tags=getTags(type);tags.splice(i,1);saveTags(type,tags);renderTagMgr();if(type==='method')renderMethodTags();else renderTriggerTags();}

// ── Pending ──
function checkPending(){var r=getRecords(),p=r.find(function(x){return x.status==='open';});G('pending-notice').style.display=p?'block':'none';}

function getV(id){return G(id).value||'';}

// ── Save Entry ──
function saveEntry(){
  if(!getV('e-asset')){showToast('请选择交易品种');return;}
  if(!dirState){showToast('请选择做多或做空');return;}
  if(!getV('e-entry')){showToast('请填写入场价格');return;}

  var records=getRecords();

  if(editingEntryId){
    // Update existing record
    var rec=records.find(function(r){return r.id===editingEntryId;});
    if(rec){
      rec.date=getV('e-date');rec.asset=getV('e-asset');rec.tf=getV('e-tf');rec.dir=dirState;
      rec.entry=getV('e-entry');rec.slprice=getV('e-slprice');rec.maxloss=getV('e-maxloss');rec.rr=getV('e-rr');rec.lev=getV('e-lev');
      rec.slDisplay=G('c-sl').textContent;rec.tpDisplay=G('c-tp').textContent;
      rec.posDisplay=G('c-pos').textContent;rec.slDist=G('c-sl-d').textContent;
      rec.method=getV('e-method');rec.trigger=getV('e-trigger');
      rec.entryImgs=entryImgs.slice();
      saveRecords(records);
      showToast('入场记录已更新 ✓');
      cancelEntryEdit();return;
    }
  }

  var pending=records.find(function(r){return r.status==='open';});
  if(pending){showToast('上笔 '+pending.asset+' ('+pending.date+')\n尚未复盘，请先完成复盘');return;}

  var rec={
    id:Date.now(),date:getV('e-date'),asset:getV('e-asset'),tf:getV('e-tf'),dir:dirState,
    entry:getV('e-entry'),slprice:getV('e-slprice'),maxloss:getV('e-maxloss'),rr:getV('e-rr'),lev:getV('e-lev'),
    slDisplay:G('c-sl').textContent,tpDisplay:G('c-tp').textContent,
    posDisplay:G('c-pos').textContent,slDist:G('c-sl-d').textContent,
    method:getV('e-method'),trigger:getV('e-trigger'),
    entryImgs:entryImgs.slice(),reviewImgs:[],
    status:'open',result:'',exit:'',pnl:'',diff:'',lesson:'',emo:'',
    savedAt:new Date().toISOString()
  };
  records.unshift(rec);saveRecords(records);
  var dt=dirState==='long'?'做多':'做空',pl=G('c-pos-lbl').textContent;
  copyText('【入场记录】'+rec.date+'\n品种：'+rec.asset+'　方向：'+dt+'　周期：'+rec.tf+'\n入场：'+rec.entry+'　止损价：'+rec.slDisplay+'　目标价：'+rec.tpDisplay+'\n止损距离：'+rec.slDist+'　最大亏损：'+(rec.maxloss||'—')+'\n'+pl+'：'+rec.posDisplay+'\n方法：'+(rec.method||'—')+'\n触发：'+(rec.trigger||'—'));
  showToast('已保存并复制 ✓');checkPending();
  selMethods=[];selTriggers=[];entryImgs=[];
  renderMethodTags();renderTriggerTags();renderImgGrid('entry');
  G('e-method').value='';G('e-trigger').value='';
}

function cancelEntryEdit(){
  editingEntryId=null;
  G('entry-edit-bar').classList.remove('show');
  G('entry-save-btn').textContent='保存入场记录';
  G('pending-notice').style.display='none';
  entryImgs=[];renderImgGrid('entry');
}

// ── Save Review ──
function saveReview(){
  var records=getRecords();if(!records.length){showToast('请先记录入场');return;}
  var target;
  if(reviewTargetId)target=records.find(function(r){return r.id===reviewTargetId;});
  if(!target)target=records.find(function(r){return r.status==='open';});
  if(!target){showToast('没有待复盘的交易');return;}
  target.result=resState;target.exit=getV('r-exit');target.pnl=getV('r-pnl');
  target.diff=getV('r-diff');target.lesson=getV('r-lesson');
  target.emo=G('r-emo').value;target.status=resState||'open';
  target.reviewImgs=reviewImgs.slice();
  saveRecords(records);
  var dt=target.dir==='long'?'做多':'做空',rm={win:'盈利',loss:'亏损',flat:'保本/小亏'};
  copyText('【完整交易记录】'+target.date+'\n品种：'+target.asset+'　方向：'+dt+'　周期：'+target.tf+'\n入场：'+target.entry+'　止损价：'+target.slDisplay+'　目标价：'+target.tpDisplay+'\n─────\n结果：'+(rm[resState]||'—')+'\n出场：'+(target.exit||'—')+'　盈亏：'+(target.pnl||'—')+'\n差异：'+(target.diff||'—')+'\n下次：'+(target.lesson||'—')+'\n情绪：'+target.emo+'/10');
  reviewTargetId=null;reviewImgs=[];
  G('review-target-info').style.display='none';
  G('review-edit-bar').classList.remove('show');
  G('review-save-btn').textContent='保存复盘记录';
  renderImgGrid('review');
  showToast('复盘已保存并复制 ✓');checkPending();
}

function cancelReviewEdit(){

}

// ── History ──
function renderHistory(){
  var records=getRecords(),grid=G('stats-grid'),list=G('history-list');
  var closed=records.filter(function(r){return r.result;});
  var wins=closed.filter(function(r){return r.result==='win';});
  var losses=closed.filter(function(r){return r.result==='loss';});
  var total=closed.length,wr=total?Math.round(wins.length/total*100):0;
  function avgR(arr){if(!arr.length)return 0;return(arr.reduce(function(s,r){var m=r.pnl&&r.pnl.match(/([\d.]+)R/);return s+(m?parseFloat(m[1]):1);},0)/arr.length).toFixed(2);}
  var aw=avgR(wins),al=avgR(losses),exp=total?((wins.length/total*parseFloat(aw))-(losses.length/total*parseFloat(al))).toFixed(2):0;
  var maxCL=0,curCL=0;
  records.slice().reverse().forEach(function(r){if(r.result==='loss'){curCL++;maxCL=Math.max(maxCL,curCL);}else curCL=0;});
  var dy=function(i){return 'animation-delay:'+(i*0.05)+'s';};
  grid.innerHTML=[[''+records.length,'总交易次数','含未复盘',''],[''+wr+'%','胜率','已复盘 '+total+' 笔',wr>=50?'g':'r'],[''+wins.length,'盈利次数','平均 '+aw+'R','g'],[''+losses.length,'亏损次数','平均 '+al+'R','r'],[exp+'R','期望值','正数代表系统有优势',parseFloat(exp)>0?'g':'r'],[''+maxCL,'最大连续亏损','连续亏损峰值','r']].map(function(s,i){return '<div class="stat-c" style="'+dy(i)+'"><div class="sv '+s[3]+'">'+s[0]+'</div><div class="sl">'+s[1]+'</div><div class="sd">'+s[2]+'</div></div>';}).join('');

  if(!records.length){list.innerHTML='<div class="empty">还没有交易记录<br>从入场开始记录吧</div>';return;}

  var dm={long:'做多 ↑',short:'做空 ↓'},rm={win:'盈利',loss:'亏损',flat:'保本',open:'持仓中','':`持仓中`};

  list.innerHTML=records.map(function(r,i){
    var pc=r.result==='win'?' g':r.result==='loss'?' r':'';
    var dotCls=r.status==='open'?'open':r.result||'open';

    // Tags summary
    var methodTags=(r.method||'').split('、').filter(Boolean).map(function(t){return '<span class="hi-tag">'+t+'</span>';}).join('');
    var triggerTags=(r.trigger||'').split('、').filter(Boolean).map(function(t){return '<span class="hi-tag trigger">'+t+'</span>';}).join('');
    var tagsHtml=(methodTags||triggerTags)?'<div class="hi-tags">'+methodTags+triggerTags+'</div>':'';

    // Entry images
    var entImgs=(r.entryImgs||[]);
    var thumbsHtml=entImgs.length?'<div class="hi-thumbs">'+entImgs.slice(0,4).map(function(src,idx){return '<img class="hi-thumb" src="'+src+'" onclick="openLbFromHistory(event,'+r.id+',\'entry\','+idx+')">';}).join('')+(entImgs.length>4?'<span style="font-size:12px;color:var(--t3);align-self:center">+'+(entImgs.length-4)+'</span>':'')+'</div>':'';

    // Review images
    var revImgs=(r.reviewImgs||[]);
    var revThumbsHtml=revImgs.length?'<div class="hi-thumbs">'+revImgs.slice(0,4).map(function(src,idx){return '<img class="hi-thumb" src="'+src+'" onclick="openLbFromHistory(event,'+r.id+',\'review\','+idx+')">';}).join('')+(revImgs.length>4?'<span style="font-size:12px;color:var(--t3);align-self:center">+'+(revImgs.length-4)+'</span>':'')+'</div>':'';

    // Review notes
    var noteHtml='';
    if(r.diff||r.lesson){
      noteHtml='<div class="hi-note">';
      if(r.diff) noteHtml+='<div><span style="color:var(--t3)">差异：</span>'+r.diff+'</div>';
      if(r.lesson) noteHtml+='<div style="margin-top:4px"><span style="color:var(--t3)">教训：</span>'+r.lesson+'</div>';
      noteHtml+='</div>';
    }

    // Action buttons
    var actionBtns='<div class="hi-actions">'
      +'<button class="hi-action-btn edit" onclick="openEditEntry('+r.id+');event.stopPropagation()">✏️ 编辑入场</button>';
    if(r.status==='open'){
      actionBtns+='<button class="hi-action-btn review" onclick="openReview('+r.id+');event.stopPropagation()">📝 去复盘</button>';
    } else {
      actionBtns+='<button class="hi-action-btn review-edit" onclick="openReview('+r.id+');event.stopPropagation()">📝 编辑复盘</button>';
    }
    actionBtns+='</div>';

    return '<div class="hi" style="'+dy(i)+'" id="hi-'+r.id+'">'
      +'<div class="hi-main" onclick="toggleHiDetail('+r.id+')">'
        +'<div class="hi-dot '+dotCls+'"></div>'
        +'<div class="hi-info">'
          +'<div class="hi-top"><span class="hi-asset">'+(r.asset||'—')+'</span><span class="hi-pnl'+pc+'">'+(r.pnl||rm[r.status])+'</span></div>'
          +'<div class="hi-bot"><span class="hi-date">'+r.date+'</span><span class="hi-dir">'+(dm[r.dir]||'—')+' · '+(r.tf||'')+'</span></div>'
        +'</div>'
        +'<div class="hi-more">···</div>'
      +'</div>'
      +'<div class="hi-detail" id="hid-'+r.id+'">'
        +tagsHtml
        +thumbsHtml
        +revThumbsHtml
        +noteHtml
        +actionBtns
      +'</div>'
    +'</div>';
  }).join('');
}

// ── Toggle history card detail ──
function toggleHiDetail(id){
  var detail=G('hid-'+id);
  if(!detail)return;
  var isOpen=detail.classList.contains('open');
  // Close all others
  document.querySelectorAll('.hi-detail.open').forEach(function(d){d.classList.remove('open');});
  if(!isOpen) detail.classList.add('open');
}

// Open lightbox from history card
function openLbFromHistory(e,id,which,idx){
  e.stopPropagation();
  var records=getRecords(),r=records.find(function(x){return x.id===id;});
  if(!r)return;
  var imgs=which==='entry'?(r.entryImgs||[]):(r.reviewImgs||[]);
  if(!imgs.length)return;
  // Temporarily set lightbox images
  lbWhich='_history_'+id+'_'+which;
  lbHistoryImgs=imgs;
  lbIdx=idx;
  var track=G('lb-track');
  track.innerHTML=imgs.map(function(src){return '<div class="lb-slide"><img src="'+src+'"/></div>';}).join('');
  track.style.transition='none';
  track.style.transform='translateX(-'+idx+'00%)';
  G('lb-counter').textContent=(idx+1)+' / '+imgs.length;
  G('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
  var lb=G('lightbox');
  lb.addEventListener('touchstart',lbTouchStart,{passive:true});
  lb.addEventListener('touchend',lbTouchEnd,{passive:true});
}

// ── Export ──
function exportExcel(){
  var records=getRecords();if(!records.length){showToast('暂无记录');return;}
  var h=['日期','品种','方向','周期','入场价','止损价','止损价(算)','目标价','止损距离','最大亏损','仓位/保证金','盈亏比','杠杆','结果','出场价','盈亏','差异','教训','情绪','时间'];
  var dm={long:'做多',short:'做空'},rm={win:'盈利',loss:'亏损',flat:'保本',open:'持仓中','':`持仓中`};
  var rows=records.map(function(r){return[r.date,r.asset,dm[r.dir]||'',r.tf,r.entry,r.slprice,r.slDisplay||'',r.tpDisplay||'',r.slDist||'',r.maxloss||'',r.posDisplay||'',r.rr||'',r.lev||'',rm[r.result]||rm[r.status],r.exit||'',r.pnl||'',r.diff||'',r.lesson||'',r.emo||'',r.savedAt||''];});
  var csv='\uFEFF'+[h].concat(rows).map(function(row){return row.map(function(v){var s=String(v||'').replace(/"/g,'""');return(s.indexOf(',')>=0||s.indexOf('\n')>=0||s.indexOf('"')>=0)?'"'+s+'"':s;}).join(',');}).join('\n');
  dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'交易日志_'+now()+'.csv');
  showToast('Excel 已下载');
}
function exportJSON(){
  var r=getRecords();
  var data={
    version:2,
    exportedAt:new Date().toISOString(),
    records:r,
    methods:getTags('method'),
    triggers:getTags('trigger'),
    settings:JSON.parse(localStorage.getItem('tj_settings')||'{}')
  };
  dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'交易日志_'+now()+'.json');
  showToast('JSON 已下载（含标签和设置）');
}

function importJSON(input){
  var f=input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var parsed=JSON.parse(e.target.result);

      // Support both old format (plain array) and new format
      var data, methods, triggers, settings;
      if(Array.isArray(parsed)){
        data=parsed; methods=null; triggers=null; settings=null;
      } else {
        data=parsed.records||[];
        methods=parsed.methods||null;
        triggers=parsed.triggers||null;
        settings=parsed.settings||null;
      }

      if(!Array.isArray(data)){showToast('文件格式错误，请选择正确的备份文件');return;}

      // Merge records
      var existing=getRecords();
      var existingIds=existing.map(function(r){return r.id;});
      var newRecords=data.filter(function(r){return existingIds.indexOf(r.id)===-1;});
      var merged=existing.concat(newRecords);
      merged.sort(function(a,b){return b.id-a.id;});
      saveRecords(merged);

      // Merge tags (combine, deduplicate)
      var tagMsg='';
      if(methods){
        var curM=getTags('method');
        var mergedM=curM.concat(methods.filter(function(t){return curM.indexOf(t)===-1;}));
        saveTags('method',mergedM);
        tagMsg+=' 方法标签 '+mergedM.length+' 个';
      }
      if(triggers){
        var curT=getTags('trigger');
        var mergedT=curT.concat(triggers.filter(function(t){return curT.indexOf(t)===-1;}));
        saveTags('trigger',mergedT);
        tagMsg+=' 触发标签 '+mergedT.length+' 个';
      }

      // Restore settings (overwrite — these are personal preferences)
      var settingsMsg='';
      if(settings&&(settings.rr||settings.lev)){
        localStorage.setItem('tj_settings',JSON.stringify(settings));
        loadSettings(); // refresh UI inputs
        settingsMsg=' 设置已恢复';
      }

      renderHistory();checkPending();
      renderMethodTags();renderTriggerTags();
      showToast('导入成功\n记录新增 '+newRecords.length+' 条，共 '+merged.length+' 条'+(tagMsg?'\n'+tagMsg:'')+(settingsMsg?'\n'+settingsMsg:''));
    }catch(err){
      showToast('导入失败，文件格式不正确');
    }
    input.value='';
  };
  reader.readAsText(f);
}
function dl(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function now(){return new Date().toISOString().split('T')[0];}
function clearData(){if(confirm('确定要清除所有交易记录吗？此操作不可恢复。')){localStorage.removeItem('tj_records');renderHistory();checkPending();showToast('已清除');}}

// ── Utils ──
function copyText(t){try{navigator.clipboard.writeText(t);}catch(e){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
var _tt;
function showToast(msg){var t=G('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},2800);}

init();
